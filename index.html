<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hobbyhive: small communities for your hobbies</title>
<meta name="description" content="Hobbyhive: small communities for plants, books, tech, games and more.">
<meta property="og:title" content="Hobbyhive">
<meta property="og:description" content="Small communities for plants, books, tech, games and more.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2314142B'/><polygon points='0,-13.5 11.69,-6.75 11.69,6.75 0,13.5 -11.69,6.75 -11.69,-6.75' transform='translate(19,20.75)' fill='%23FFC21A'/><polygon points='0,-13.5 11.69,-6.75 11.69,6.75 0,13.5 -11.69,6.75 -11.69,-6.75' transform='translate(45,20.75)' fill='%232BA36B'/><polygon points='0,-13.5 11.69,-6.75 11.69,6.75 0,13.5 -11.69,6.75 -11.69,-6.75' transform='translate(32,43.25)' fill='%23E4559F'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4fb;--card:#fff;--ink:#1b1b2f;--mut:#6b6b85;--line:#e8e7f3;--acc:hsl(var(--h,140) 65% 40%);--soft:hsl(var(--h,140) 80% 94%);--r:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f1a;--card:#171829;--ink:#ecebff;--mut:#9c9bb8;--line:#27283d;--acc:hsl(var(--h,140) 70% 62%);--soft:hsl(var(--h,140) 35% 17%)}}
:root[data-theme="dark"]{--bg:#0e0f1a;--card:#171829;--ink:#ecebff;--mut:#9c9bb8;--line:#27283d;--acc:hsl(var(--h,140) 70% 62%);--soft:hsl(var(--h,140) 35% 17%)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:280px 1fr;gap:22px;max-width:1180px;margin:0 auto;padding:18px}
.side{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;gap:10px}
.brand{font-size:19px;font-weight:800;padding:4px 6px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
#clist{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;padding-right:2px}
.ci{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:12px;cursor:pointer;text-align:left}
.ci:hover{background:var(--card)}
.ci.on{background:var(--card);box-shadow:0 1px 8px #0001;outline:2px solid hsl(var(--h) 70% 55%)}
.ci .em{font-size:20px}.ci .nm{flex:1;font-weight:600}.ci .n{font-size:12px;color:var(--mut)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px dashed var(--mut)}
.btn.sm{padding:6px 12px;font-size:13px}.btn.plain{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px}
.hero{border-radius:24px;padding:28px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 75% 52%),hsl(calc(var(--h) + 45) 80% 40%));display:flex;gap:18px;align-items:center}
.hero .big{font-size:52px}.hero h1{margin:0;font-size:28px;font-weight:800}.hero p{margin:4px 0 0;opacity:.92}
.card,.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.tools input{flex:2;min-width:160px}.tools select{flex:1;min-width:120px;width:auto}
#chips{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px}
.chip.on{background:var(--acc);color:#fff;border-color:transparent}
.ph{display:flex;gap:10px;align-items:center}.ph small{color:var(--mut);display:block}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:hsl(var(--h) 65% 50%)}
.pill{background:var(--soft);color:var(--acc);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.post h3{margin:12px 0 6px;font-size:18px}.post p{margin:8px 0;white-space:pre-wrap;word-break:break-word}
.meta,.tags,.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tags{color:var(--acc);font-size:13px;font-weight:600}
.act{margin-top:10px}.act button{border:0;background:var(--bg);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600}
.act button.liked{background:var(--soft);color:var(--acc)}
.cms{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.cm{background:var(--bg);border-radius:12px;padding:8px 12px}.cm small{color:var(--mut)}
.send{display:flex;gap:8px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
dialog{border:0;border-radius:var(--r);background:var(--card);color:var(--ink);padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:#0009}dialog h2{margin:0 0 12px}dialog label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut);font-weight:600}
@media(max-width:820px){.app{grid-template-columns:1fr;padding:12px}.side{position:static;height:auto}#clist{flex-direction:row;overflow-x:auto}.ci{flex:none;background:var(--card)}.hero{padding:20px}.hero .big{font-size:40px}}
.media{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:8px}.media img,.media video{width:100%;max-height:420px;object-fit:cover;border-radius:14px;background:#000}.up{display:block;margin-top:10px;padding:12px;border:1px dashed var(--mut);border-radius:12px;color:var(--mut);cursor:pointer;font-weight:600}.up input{margin-top:6px;border:0;padding:0;background:transparent}
.x{border:0;background:transparent;color:var(--mut);cursor:pointer;float:right}.act button[data-m]{border:0;background:var(--bg);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600}#mBody .card{margin-top:10px}
.media img{cursor:zoom-in}#pv img,#pv video{max-height:120px;cursor:default}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.card.unread{border-color:var(--acc)}
input[type=search]{-webkit-appearance:none;appearance:none}
.brand{display:flex;align-items:center;gap:8px}
#hero{position:relative;overflow:hidden}.deco{position:absolute;inset:0;pointer-events:none}.ti{width:1em;height:1em;flex:none}.deco svg{position:absolute;color:rgba(255,255,255,.2)}#hero>div:not(.deco){position:relative;z-index:1}.hero .big svg{color:#fff}.ci .em svg{font-size:20px}
</style>
</head>

if(m==='delp'){if(!b.dataset.p||!confirm('Delete this post?'))return;r=await sb.from('posts').delete().eq('id',b.dataset.p)}
else if(m==='dis')r=await sb.from('reports').update({resolved:true}).eq('id',rid);
else if(m==='ban'){if(!confirm('Ban this user?'))return;r=await sb.from('profiles').update({banned:true}).eq('id',b.dataset.u)}
else if(m==='tban')r=await sb.from('profiles').update({banned:b.dataset.v==='1'}).eq('id',b.dataset.u);
else if(m==='tmod')r=await sb.from('profiles').update({role:b.dataset.v}).eq('id',b.dataset.u);
if(r&&r.error){alert(r.error.message);return}await panel();loadP()};
function dcMode(c){ui.edit=c?c.id:null;$('#cH').textContent=c?'Edit community':'Create a community';$('#cOk').textContent=c?'Save':'Create';$('#cE').value=c?c.emoji:'✨';$('#cN').value=c?c.name:'';$('#cT').value=c?c.tag:'';$('#cY').value=c?c.types.join(','):'Discussion,Question,Showcase';['cF1','cF2'].forEach((i,k)=>{const el=$('#'+i);el.value=c?((c.fields[k]||{}).label||''):'';el.disabled=!!c})}
$('#hero').onclick=async e=>{const c=cur();if(e.target.id==='ced'){dcMode(c);$('#dC').showModal()}else if(e.target.id==='cdel'){if(!confirm('Delete "'+c.name+'" and ALL its posts? This cannot be undone.'))return;const{error}=await sb.rpc('delete_community',{cid:c.id});if(error){alert(error.message);return}await loadC();setCur('plants')}};
async function openProfile(){$('#pNm').textContent=nm();$('#pAv').innerHTML=avh(S.av,nm());$('#dP').showModal();
const{data}=await sb.from('posts').select('id,community,title,created_at').eq('author_id',S.u.id).order('created_at',{ascending:false}).limit(50);const names=Object.fromEntries(all().map(c=>[c.id,c.name]));
$('#pList').innerHTML=(data||[]).length?data.map(p=>`<div class="card" style="padding:10px 14px;display:flex;gap:10px;align-items:center"><div style="flex:1;cursor:pointer" data-go="${p.id}" data-c="${esc(p.community)}"><b>${esc(p.title)}</b><br><small>${esc(names[p.community]||p.community)} · ${ago(Date.parse(p.created_at))}</small></div><button class="x" data-dp="${p.id}">🗑️</button></div>`).join(''):'<div class="empty">You have not posted yet.</div>'}
$('#pList').onclick=async e=>{const d=e.target.closest('[data-dp]'),g=e.target.closest('[data-go]');if(d){if(!confirm('Delete this post?'))return;const{error}=await sb.from('posts').delete().eq('id',d.dataset.dp);if(error){alert(error.message);return}openProfile();loadP()}else if(g){$('#dP').close();setCur(g.dataset.c)}};
$('#pX').onclick=()=>$('#dP').close();
$('#pOut').onclick=async()=>{$('#dP').close();window._mo=true;await sb.auth.signOut();window._mo=false};
$('#pAf').onchange=async e=>{const f=e.target.files[0];if(!f||!/^image\//.test(f.type))return;const b=await shrink(f,400),path=`${S.u.id}/avatar-${Date.now()}.jpg`;let r=await sb.storage.from('media').upload(path,b,{contentType:b.type});if(r.error){alert(r.error.message);return}const url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;r=await sb.rpc('set_avatar',{url});if(r.error){alert(r.error.message);return}S.av=url;$('#pAv').innerHTML=avh(url,nm());loadP()};
async function loadN(){if(!sb)return;if(!S.u){$('#bell').hidden=true;return}$('#bell').hidden=false;const{count}=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('read',false);$('#bn').textContent=count||''}
$('#bell').onclick=async()=>{const{data}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(30);
$('#nList').innerHTML=(data||[]).length?data.map(n=>`<div class="card ${n.read?'':'unread'}" data-n="${n.post_id}" data-c="${esc(n.community||'')}" style="cursor:pointer"><div>${esc(n.message)}</div><small>${ago(Date.parse(n.created_at))}</small></div>`).join(''):'<div class="empty">No notifications yet.</div>';
$('#dN').showModal();await sb.from('notifications').update({read:true}).eq('read',false);loadN()};
$('#nList').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;ui.cm[b.dataset.n]=true;$('#dN').close();setCur(b.dataset.c||S.cur)};
async function shrink(f,m=1600){if(!/^image\/(jpeg|png|webp)$/.test(f.type))return f;try{const bm=await createImageBitmap(f),k=Math.min(1,m/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(bm,0,0,cv.width,cv.height);const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));return b&&b.size<f.size?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(e){return f}}
$('#comp').onchange=e=>{if(e.target.id!=='pF')return;const pv=$('#pv');pv.innerHTML='';[...e.target.files].slice(0,4).forEach(f=>{const u=URL.createObjectURL(f);pv.insertAdjacentHTML('beforeend',f.type.startsWith('video')?`<video muted src="${u}"></video>`:`<img alt="" src="${u}">`)})};
$('#feed').addEventListener('click',e=>{if(e.target.matches('.media img')){$('#lbi').src=e.target.src;$('#lb').showModal()}});
$('#lb').onclick=()=>$('#lb').close();
async function init(){await loadC();const{data}=await sb.auth.getSession();S.u=data.session?data.session.user:null;await loadMe();renderAll();loadP();
sb.auth.onAuthStateChange((_e,s)=>{console.log('auth event:',_e);const had=!!S.u;S.u=s?s.user:null;if(!S.u)ui.open=false;if(_e==='SIGNED_OUT'&&had&&!window._mo)alert('Supabase signed you out unexpectedly. Check that your computer clock is correct, and open the app from localhost or a hosted link instead of the Downloads folder.');setTimeout(async()=>{await loadMe();renderAll();loadP()},0)});
setInterval(()=>{if(!document.hidden&&!ui.open&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){loadP();loadN()}},20000)}
if(CFG){renderAll();$('#feed').innerHTML='<div class="empty">⚙️ Add your Supabase URL and anon key at the top of the script to go live (see setup steps).</div>'}else init();

</script>
